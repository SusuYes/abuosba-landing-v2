name: Build and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # the vault repo can rebuild the site when a thought changes (see README)
  repository_dispatch:
    types: [thoughts]

permissions:
  contents: read

# Never cancel a deploy that is already publishing
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # set when the vault is checked out below; otherwise the build uses src/content/thoughts
      THOUGHTS_DIR: ${{ vars.THOUGHTS_REPO != '' && format('vault/{0}', vars.THOUGHTS_PATH) || '' }}
    steps:
      - uses: actions/checkout@v5

      # Thoughts come from the Obsidian vault's private repo, when one is set up (repo variable THOUGHTS_REPO,
      # its posts folder THOUGHTS_PATH, and a read-only token in the secret THOUGHTS_TOKEN)
      - uses: actions/checkout@v5
        if: vars.THOUGHTS_REPO != ''
        with:
          repository: ${{ vars.THOUGHTS_REPO }}
          token: ${{ secrets.THOUGHTS_TOKEN }}
          path: vault

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run check

      - name: Build static site
        run: npm run build

      - uses: actions/upload-pages-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
