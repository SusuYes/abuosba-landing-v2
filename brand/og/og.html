*{ box-sizing:border-box; margin:0; }
body{ background:#2c3036; padding:20px; display:flex; flex-direction:column; gap:26px; font-family:'Alegreya', Georgia, serif; }
.card{ width:1200px; height:630px; position:relative; overflow:hidden; background:#161b44; color:#ece8e0; }
.card.day{ background:#ece8e0; color:#1b1a17; }
.lbl{ font:500 15px 'Alegreya Sans SC', sans-serif; letter-spacing:.16em; text-transform:uppercase; color:#b78a3c; }
.ar{ font-family:'Noto Naskh Arabic', serif; }
.qc{ height:18px; background:#f4efe6; -webkit-mask:var(--chev) repeat-x left center / 23px 18px; mask:var(--chev) repeat-x left center / 23px 18px; }
.day .qc{ background:#b9aa90; }
/* 1 */
.o1{ display:flex; flex-direction:column; align-items:center; justify-content:center; gap:22px; }
.o1 img{ height:390px; } .o1 h1{ font:500 54px/1 'Alegreya', serif; letter-spacing:.01em; }
.o1 .ar{ font-size:30px; color:#b8b3c9; margin-top:-8px; }
.day .ar{ color:#5d5a52; }
/* 2 */
.o2{ display:grid; grid-template-columns:520px 1fr; align-items:center; }
.o2 .l{ display:flex; justify-content:center; } .o2 .l img{ height:470px; }
.o2 .r{ border-left:2px solid #b78a3c; padding:30px 0 30px 56px; display:flex; flex-direction:column; gap:14px; }
.o2 h1{ font:500 72px/1.02 'Alegreya', serif; } .o2 .ar{ font-size:38px; color:#b8b3c9; text-align:left; } .o2 p{ font:400 28px/1.35 'Alegreya', serif; color:#d6d1c6; max-width:22ch; margin-top:10px; }
/* 3 */
.o3{ display:flex; flex-direction:column; align-items:center; }
.o3 .win{ position:relative; width:880px; margin-top:58px; }
.o3 .win svg{ width:880px; height:auto; display:block; filter:drop-shadow(0 0 26px rgba(240,185,58,.35)); }
.o3 .win img{ position:absolute; left:50%; bottom:-6px; height:250px; transform:translateX(-50%); }
.o3 .nm{ margin-top:34px; display:flex; align-items:baseline; gap:26px; } .o3 h1{ font:500 50px/1 'Alegreya', serif; } .o3 .ar{ font-size:32px; color:#b8b3c9; }
/* 4 */
.o4{ display:flex; flex-direction:column; align-items:center; justify-content:center; gap:26px; }
.o4 img{ height:330px; } .o4 h1{ font:500 34px 'Alegreya Sans SC', sans-serif; letter-spacing:.22em; text-transform:uppercase; color:#d6d1c6; }
.o4 .qc{ position:absolute; left:0; right:0; top:0; } .o4 .qc.b{ top:auto; bottom:0; }
/* 6 */
.o6{ padding:64px 76px; display:flex; flex-direction:column; gap:22px; }
.o6 .mk{ position:absolute; right:64px; top:56px; height:120px; }
.o6 h1{ font:500 76px/1.04 'Alegreya', serif; max-width:15ch; text-wrap:balance; margin-top:6px; }
.o6 .ar{ font-size:40px; color:#f0b93a; }
.o6 .ft{ position:absolute; left:76px; bottom:50px; font:500 20px 'Alegreya Sans SC', sans-serif; letter-spacing:.16em; text-transform:uppercase; color:#a9a6b8; }
.o6 .qg{ display:flex; align-items:center; gap:14px; width:520px; } .o6 .rl{ flex:1; height:1px; background:#b78a3c; }
.o6 .bar{ width:2px; height:40px; background:#f0b93a; } .o6 .panes{ display:flex; gap:6px; }
.o6 .pane{ display:flex; align-items:flex-end; justify-content:center; width:46px; height:60px; padding-bottom:7px; border-radius:23px 23px 2px 2px; background:var(--c); border:1px solid #161b44; }
.o6 .pane span{ font:33px/1 'Noto Sans Old South Arabian', serif; color:#1b1a17; }
.o6 .gloss{ font:500 19px 'Alegreya Sans SC', sans-serif; letter-spacing:.1em; color:#a9a6b8; margin-top:6px; }
.o6 .qdv-d{ display:flex; flex-direction:column; align-items:flex-start; }
