# The writing portal at /admin/ (Sveltia CMS). Each save is a commit to main, which the deploy workflow
# publishes, so a thought is live a minute or two after it is saved with "Live on the site" on.
# Sign in with GitHub goes through a small Cloudflare Worker (sveltia-cms-auth on Suhail's Cloudflare account) that
# trades GitHub's sign-in code for a token; a pasted GitHub token still works too. See the README.
backend:
  name: github
  repo: SusuYes/abuosba-landing-v2
  branch: main
  base_url: https://sveltia-cms-auth.suhail-f28.workers.dev
  # the repo is public, so the sign-in only needs access to public repos
  auth_scope: public_repo
  auth_methods: [oauth, token]
  commit_messages:
    create: "Write “{{slug}}”"
    update: "Edit “{{slug}}”"
    delete: "Remove “{{slug}}”"
    uploadMedia: "Add image {{path}}"
    deleteMedia: "Remove image {{path}}"

site_url: https://abuosba.com
display_url: https://abuosba.com
logo:
  src: /favicon.svg

# leave blank optional fields out of the file instead of writing ''
output:
  omit_empty_optional_fields: true

media_folder: public/media/thoughts
public_folder: /media/thoughts

# English and Arabic sit side by side in one entry: en/<slug>.md and ar/<slug>.md, paired by the site. The Arabic
# side can be switched off for a thought written only in English. Translate fills one side from the other (set up
# once per browser: Settings, Languages, translation service and its key).
i18n:
  structure: multiple_folders
  locales: [en, ar]
  default_locale: en
  initial_locales: all

collections:
  - name: thoughts
    label: Thoughts
    label_singular: Thought
    description: Essays and notes, in English and Arabic. Each language goes live when its own “Live on the site” is on.
    folder: src/content/thoughts
    create: true
    format: frontmatter
    extension: md
    i18n: true
    # the file name is the address: /thoughts/<slug>/, and /ar/thoughts/<slug>-ar/ for the Arabic
    slug:
      template: "{{title}}"
      editable: [create]
      hint: The address, /thoughts/<this>/. It can’t change once saved.
      pattern: ["^[a-z0-9]+(-[a-z0-9]+)*$", "Lower-case letters, numbers and dashes only"]
    aliases_field: false
    summary: "{{title}} · {{date | date('YYYY-MM-DD')}}{{publish | ternary('', ' · draft')}}"
    sortable_fields:
      default:
        field: date
        direction: descending
      fields: [date, title]
    view_filters:
      - { label: Live, field: publish, pattern: true }
      - { label: Drafts, field: publish, pattern: false }
    fields:
      - { name: title, label: Title, widget: string, i18n: true }
      - { name: dek, label: Dek, hint: One line under the title., widget: string, required: false, i18n: true }
      - name: body
        label: Body
        hint: To cite a source, type its number from the list below in brackets, like [1].
        widget: markdown
        i18n: true
      - name: sources
        label: Sources
        label_singular: Source
        hint: Shown under the thought, numbered in this order. The same list is used for both languages.
        widget: list
        required: false
        i18n: duplicate
        summary: "{{fields.title}}"
        fields:
          - { name: title, label: Title, hint: "What it is, e.g. Warren and Brandeis, The Right to Privacy (1890)", widget: string }
          - { name: url, label: Link, widget: string, required: false }
          - { name: note, label: Note, hint: "Optional, e.g. a page or what it shows.", widget: string, required: false }
      - name: publish
        label: Live on the site
        hint: Off keeps this language a draft. Saving with it on publishes it.
        widget: boolean
        default: false
        i18n: true
      - { name: date, label: Date, widget: datetime, type: date, format: YYYY-MM-DD, default: "{{now}}", i18n: duplicate }
      - { name: kind, label: Kind, widget: select, options: [Essay, Note], default: Note, i18n: duplicate }
      - name: excerpt
        label: Excerpt
        hint: Optional. The cards use the first paragraph without it.
        widget: text
        required: false
        i18n: true
