# The writing portal at /admin/ (Sveltia CMS). Each save is a commit to main, which the deploy workflow
# publishes, so a thought is live a minute or two after it is saved with "Live on the site" on.
# Sign in with GitHub goes through a small Cloudflare Worker (sveltia-cms-auth on Suhail's Cloudflare account) that
# trades GitHub's sign-in code for a token; a pasted GitHub token still works too. See the README.
backend:
  name: github
  repo: SusuYes/abuosba-landing-v2
  branch: main
  base_url: https://sveltia-cms-auth.suhail-f28.workers.dev
  # the repo is public, so the sign-in only needs access to public repos
  auth_scope: public_repo
  auth_methods: [oauth, token]
  commit_messages:
    create: "Write “{{slug}}”"
    update: "Edit “{{slug}}”"
    delete: "Remove “{{slug}}”"
    uploadMedia: "Add image {{path}}"
    deleteMedia: "Remove image {{path}}"

site_url: https://abuosba.com
display_url: https://abuosba.com
logo:
  src: /favicon.svg

# leave blank optional fields out of the file instead of writing ''
output:
  omit_empty_optional_fields: true

media_folder: public/media/thoughts
public_folder: /media/thoughts

collections:
  - name: thoughts
    label: Thoughts
    label_singular: Thought
    description: Essays and notes. A thought shows on the site only when “Live on the site” is on.
    folder: src/content/thoughts
    create: true
    format: frontmatter
    extension: md
    # the file name is the address: /thoughts/<slug>/ (the Arabic one of a pair ends in -ar by habit)
    slug:
      template: "{{title}}"
      editable: [create]
      hint: The address, /thoughts/<this>/. It can’t change once saved. For an Arabic thought, use the English slug plus -ar.
      pattern: ["^[a-z0-9]+(-[a-z0-9]+)*$", "Lower-case letters, numbers and dashes only"]
    aliases_field: false
    preview_path: "/thoughts/{{slug}}/"
    summary: "{{title}} · {{date | date('YYYY-MM-DD')}}{{publish | ternary('', ' · draft')}}"
    sortable_fields:
      default:
        field: date
        direction: descending
      fields: [date, title]
    view_filters:
      - { label: Live, field: publish, pattern: true }
      - { label: Drafts, field: publish, pattern: false }
      - { label: English, field: lang, pattern: en }
      - { label: Arabic, field: lang, pattern: ar }
    fields:
      - { name: title, label: Title, widget: string }
      - name: publish
        label: Live on the site
        hint: Off keeps it a draft. Saving with this on publishes it.
        widget: boolean
        default: false
      - { name: date, label: Date, widget: datetime, type: date, format: YYYY-MM-DD, default: "{{now}}" }
      - { name: dek, label: Dek, hint: One line under the title., widget: string, required: false }
      - name: kind
        label: Kind
        widget: select
        options: [Essay, Note]
        default: Note
      - name: lang
        label: Language
        hint: Arabic thoughts show only on the Arabic site.
        widget: select
        options: [{ label: English, value: en }, { label: العربية, value: ar }]
        default: en
      - name: pair
        label: Same thought in the other language
        widget: relation
        collection: thoughts
        value_field: "{{slug}}"
        search_fields: [title]
        display_fields: [title]
        required: false
      - name: excerpt
        label: Excerpt
        hint: Optional. The cards use the first paragraph without it.
        widget: text
        required: false
      - { name: tags, label: Tags, widget: list, required: false }
      - { name: body, label: Body, widget: markdown }
